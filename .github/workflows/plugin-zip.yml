name: Zip do plugin

# A cada mudança no plugin, gera de novo o zip que se instala no app do Claude
# e publica no release "plugin". O link de download do README não muda.
on:
  push:
    branches: [main]
    paths:
      - "plugins/**"
      - ".github/workflows/plugin-zip.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Monta o zip (pasta resgate-leads com .claude-plugin/plugin.json dentro)
        run: |
          mkdir -p build
          cp -r plugins/resgate-leads build/resgate-leads
          find build -name "__pycache__" -type d -prune -exec rm -r {} +
          find build -name ".DS_Store" -delete
          cd build && zip -r ../resgate-leads-plugin.zip resgate-leads

      - name: Publica no release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view plugin >/dev/null 2>&1; then
            gh release upload plugin resgate-leads-plugin.zip --clobber
          else
            gh release create plugin resgate-leads-plugin.zip \
              --title "Plugin resgate-leads" \
              --notes "Zip do plugin para instalar no app do Claude. Atualizado automaticamente a cada mudança no plugin." \
              --latest
          fi
